services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag_engine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/sql:/sql:ro
      - ./data/sql/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      # -h localhost: the temporary server used during init only listens on a socket,
      # so this stays unhealthy until the demo data has finished loading.
      test: ["CMD-SHELL", "pg_isready -h localhost -U rag -d rag_engine"]
      interval: 5s
      timeout: 5s
      retries: 30

  engine:
    build: .
    env_file: .env
    environment:
      # Inside Docker the services are reached by name, not localhost
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql://rag:rag@postgres:5432/rag_engine
      SQL_DATABASES: k8s_ops=postgresql://readonly:readonly@postgres:5432/k8s_ops
      MCP_HOST: 0.0.0.0
      INGEST_DIR: /app/data
      # Downloaded models (about 2 GB) live on a volume so rebuilds do not download them again
      HF_HOME: /models/huggingface
      FASTEMBED_CACHE_PATH: /models/fastembed
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - models:/models
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  postgres_data:
  qdrant_data:
  models:
