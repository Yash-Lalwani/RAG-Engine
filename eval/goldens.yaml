# ---------------------------------------------------------------- Self-RAG (vague questions)
- id: q-021
  question: Tell me about pods
  intent: rag
  feature: self_rag
  sources: [concepts__workloads__pods.html]
  reference: A Pod is the smallest deployable unit in Kubernetes, a group of one or more containers that share storage and network resources, including an IP address, and are always co-located and co-scheduled.

- id: q-022
  question: Tell me about services
  intent: rag
  feature: self_rag
  sources: [concepts__services-networking__service.txt]
  reference: A Service is a method for exposing a network application that runs as one or more Pods, giving clients a stable way to reach it without changing the application to use a new service discovery mechanism.

- id: q-023
  question: explain kubectl
  intent: rag
  feature: self_rag
  sources: [reference__kubectl__overview.pdf, reference__kubectl__cheatsheet.txt]
  reference: kubectl is the Kubernetes command line tool for communicating with a cluster's control plane through the Kubernetes API. It reads its configuration from the config file in $HOME/.kube by default.

- id: q-024
  question: configmap missing in my pod?
  intent: rag
  feature: self_rag
  sources: [tasks__configure-pod-container__configure-pod-configmap.html]
  reference: A ConfigMap reference can be marked optional. If the ConfigMap does not exist, a mounted volume is empty; if the ConfigMap exists but the referenced key does not, that path is absent under the mount point.

