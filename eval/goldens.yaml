- id: q-025
  question: How many P1 incidents have been resolved?
  intent: sql
  feature: sql
  sources: []
  reference: 392 P1 incidents have been resolved.
  reference_sql: SELECT count(*) FROM incidents WHERE severity = 'P1' AND resolved_at IS NOT NULL

- id: q-026
  question: Which cluster's deployments have the most pods in CrashLoopBackOff status?
  intent: sql
  feature: sql
  sources: []
  reference: The cluster k8s-production-uswest2-035, with 99 pods in CrashLoopBackOff.
  reference_sql: >-
    SELECT c.name, count(*) AS crashloop_pods FROM pods p
    JOIN deployments d ON p.deployment_id = d.deployment_id
    JOIN clusters c ON d.cluster_id = c.cluster_id WHERE p.status = 'CrashLoopBackOff'
    GROUP BY c.name ORDER BY crashloop_pods DESC LIMIT 1

