# Evaluation questions for the k8s-demo collection (47 Kubernetes docs + Wikipedia noise, and
# the k8s_ops demo database).
#
# intent:   rag | sql | hybrid | web        (web = not in the documents; needs the CRAG web fallback)
# feature:  the capability the question is meant to exercise
# sources:  file names in data/k8s_docs/ that contain the answer (recall@5 and MRR use these)
# reference: a short correct answer, written from the source documents (Ragas uses it)
# reference_sql: for sql and hybrid questions; its rows are compared with the generated SQL's rows

# ---------------------------------------------------------------- baseline
- id: q-001
  question: What is a Pod in Kubernetes?
  intent: rag
  feature: baseline
  sources: [concepts__workloads__pods.html]
  reference: A Pod is the smallest deployable unit of computing you can create and manage in Kubernetes. It is a group of one or more containers with shared storage and network resources and a specification for how to run the containers.

- id: q-002
  question: What is a Kubernetes Deployment and what does it manage?
  intent: rag
  feature: baseline
  sources: [concepts__workloads__controllers__deployment.txt]
  reference: A Deployment provides declarative updates for Pods and ReplicaSets. You describe a desired state and the Deployment controller changes the actual state to the desired state at a controlled rate, creating new ReplicaSets or replacing existing ones.

- id: q-003
  question: How do I see the logs of a container that crashed and was restarted?
  intent: rag
  feature: baseline
  sources: [reference__kubectl__cheatsheet.txt]
  reference: Use kubectl logs with the --previous flag, for example kubectl logs my-pod --previous (add -c my-container for a multi-container Pod). It shows the logs of the previous instantiation of the container.

- id: q-004
  question: How do containers share resources within a Pod?
  intent: rag
  feature: baseline
  sources: [concepts__workloads__pods.html]
  reference: Containers in a Pod share the Pod's network namespace, including its IP address and port space, so they can reach each other on localhost. They can also share storage through the Pod's volumes.

# ---------------------------------------------------------------- hybrid search (exact terms)
- id: q-005
  question: What does ImagePullBackOff mean during a Deployment rollout, and what does the Deployment controller do about it?
  intent: rag
  feature: hybrid
  sources: [concepts__workloads__controllers__deployment.txt]
  reference: ImagePullBackOff means the new Pods cannot pull their container image, so the rollout gets stuck. The Deployment controller stops the bad rollout automatically and stops scaling up the new ReplicaSet, depending on the rollingUpdate parameters such as maxUnavailable (25% by default).

- id: q-006
  question: How does a StatefulSet differ from a Deployment for stateful applications?
  intent: rag
  feature: hybrid
  sources: [concepts__workloads__controllers__statefulset.docx, concepts__workloads__controllers__deployment.txt]
  reference: A StatefulSet maintains a sticky identity for each of its Pods, which is useful for applications that need persistent storage or a stable, unique network identity. A Deployment manages interchangeable Pods for stateless applications.

- id: q-007
  question: What does the nodeSelector field of a Pod do?
  intent: rag
  feature: hybrid
  sources: [reference__kubernetes-api__workload-resources__pod-v1.docx]
  reference: nodeSelector is a selector that must be true for the Pod to fit on a node. It must match a node's labels for the Pod to be scheduled on that node.

- id: q-008
  question: What happens to a container that uses more memory than its limit?
  intent: rag
  feature: hybrid
  sources: [concepts__workloads__pods.html, concepts__scheduling-eviction__node-pressure-eviction.docx]
  reference: Memory limits are enforced by the kernel with out-of-memory (OOM) kills when a container exceeds its limit.

- id: q-040
  question: What are the security best practices for using RBAC and service accounts?
  intent: rag
  feature: hybrid
  sources: [concepts__security__rbac-good-practices.pdf, tasks__configure-pod-container__configure-service-account.txt]
  reference: Follow least privilege. Assign users and service accounts only the RBAC rights they need, preferably at the namespace level. Pods that do not need API access can opt out of automounting service account tokens with automountServiceAccountToken set to false.

# ---------------------------------------------------------------- reranking
- id: q-009
  question: What controls how many Pods are replaced at a time during a Deployment rolling update?
  intent: rag
  feature: rerank
  sources: [concepts__workloads__controllers__deployment.txt]
  reference: The rollingUpdate parameters maxUnavailable and maxSurge. The number of available replicas stays between replicas minus maxUnavailable and replicas plus maxSurge; both default to 25%.

- id: q-010
  question: When will my pod be ready to serve traffic?
  intent: rag
  feature: rerank
  sources: [tasks__configure-pod-container__configure-liveness-readiness-startup-probes.docx]
  reference: When its readiness probe succeeds. The kubelet then marks the Pod as ready and it receives traffic from Services; while the readiness probe fails, the Pod is not sent traffic.

- id: q-011
  question: Are Kubernetes Secrets stored securely by default, and what should I do about it?
  intent: rag
  feature: rerank
  sources: [concepts__configuration__secret.txt]
  reference: No. Secrets are stored unencrypted in etcd by default, and anyone with API access, access to etcd, or permission to create Pods in the namespace can read them. Enable encryption at rest and restrict access to Secrets with least-privilege RBAC.

- id: q-012
  question: How does Kubernetes decide which node is best to schedule a new pod on?
  intent: rag
  feature: rerank
  sources: [concepts__scheduling-eviction__kube-scheduler.pdf]
  reference: The kube-scheduler works in two steps. Filtering finds the nodes where it is feasible to run the Pod, for example nodes with enough free resources. Scoring then ranks those nodes and the Pod is bound to the highest-scoring node.

- id: q-039
  question: How do I configure a liveness probe with an HTTP endpoint to detect application failures?
  intent: rag
  feature: rerank
  sources: [tasks__configure-pod-container__configure-liveness-readiness-startup-probes.docx]
  reference: Add a livenessProbe with httpGet (a path such as /healthz and a port such as 8080) to the container. The kubelet sends the HTTP request every periodSeconds after initialDelaySeconds; a failing status code makes the kubelet kill and restart the container.

# ---------------------------------------------------------------- HyDE (paraphrased questions)
- id: q-013
  question: Is there a way to isolate network traffic between services in a cluster?
  intent: rag
  feature: hyde
  sources: [concepts__services-networking__network-policies.html]
  reference: Yes, with NetworkPolicies. They let you specify rules for traffic flow at the IP address or port level within the cluster and between Pods and the outside world. The cluster must use a network plugin that supports NetworkPolicy.

- id: q-014
  question: How can I make sure a critical workload still gets scheduled when the cluster is full?
  intent: rag
  feature: hyde
  sources: [concepts__scheduling-eviction__pod-priority-preemption.html]
  reference: Give it a higher Pod priority with a PriorityClass. If a high-priority Pod cannot be scheduled, the scheduler tries to preempt (evict) lower-priority Pods to make room for it.

- id: q-015
  question: How do I make sure my app keeps running even if a server dies?
  intent: rag
  feature: hyde
  sources: [tutorials__kubernetes-basics__deploy-app__deploy-intro.txt, tasks__run-application__run-stateless-application-deployment.docx, tutorials__kubernetes-basics__scale__scale-intro.html]
  reference: Run it as a Deployment, ideally with several replicas. If the node hosting an instance goes down or is deleted, the Deployment controller replaces the instance on another node, which gives self-healing against machine failure.

- id: q-016
  question: What stops a misbehaving tenant from using all the CPU on a shared cluster?
  intent: rag
  feature: hyde
  sources: [concepts__policy__resource-quotas.txt, concepts__policy__limit-range.html]
  reference: A ResourceQuota limits the total resource consumption per namespace, and a LimitRange constrains the requests and limits of each Pod or container in a namespace.

- id: q-038
  question: How do I make my application handle more traffic?
  intent: rag
  feature: hyde
  sources: [tutorials__kubernetes-basics__scale__scale-intro.html, concepts__workloads__controllers__deployment.txt]
  reference: Scale out by increasing the number of replicas in the Deployment, for example kubectl scale deployments/my-app --replicas=4. A Service load-balances traffic across the replicas; a Deployment can also be autoscaled.

