# ---------------------------------------------------------------- hybrid: SQL facts + documents
- id: q-029
  question: How many pods are currently in Pending status, and what can keep a pod in Pending?
  intent: hybrid
  feature: hybrid_sql
  sources: [reference__kubernetes-api__workload-resources__pod-v1.docx]
  reference: 7621 pods are in Pending status. A Pod stays Pending when it has been accepted but one or more of its container images has not been created yet, which includes time before it is scheduled and time spent downloading images.
  reference_sql: SELECT count(*) FROM pods WHERE status = 'Pending'

- id: q-030
  question: How many pods are in CrashLoopBackOff, and how does a liveness probe decide to restart a container?
  intent: hybrid
  feature: hybrid_sql
  sources: [tasks__configure-pod-container__configure-liveness-readiness-startup-probes.docx]
  reference: 3775 pods are in CrashLoopBackOff. A liveness probe runs periodically; when it fails (for example the command returns non-zero or the HTTP check fails), the kubelet kills the container and restarts it.
  reference_sql: SELECT count(*) FROM pods WHERE status = 'CrashLoopBackOff'

- id: q-031
  question: How many nodes are NotReady, and what does the kubelet do when a node runs low on memory?
  intent: hybrid
  feature: hybrid_sql
  sources: [concepts__scheduling-eviction__node-pressure-eviction.docx]
  reference: 775 nodes are NotReady. When a node is low on memory, the kubelet proactively terminates (evicts) Pods to reclaim resources; if an out-of-memory event happens before it can reclaim memory, the kernel oom_killer responds based on each Pod's QoS class.
  reference_sql: SELECT count(*) FROM nodes WHERE status = 'NotReady'

- id: q-032
  question: How many deployments run with only one replica, and how do I scale a Deployment?
  intent: hybrid
  feature: hybrid_sql
  sources: [tutorials__kubernetes-basics__scale__scale-intro.html]
  reference: 2863 deployments run with one replica. Scale a Deployment by changing its number of replicas, for example kubectl scale deployments/my-app --replicas=4.
  reference_sql: SELECT count(*) FROM deployments WHERE replicas = 1

