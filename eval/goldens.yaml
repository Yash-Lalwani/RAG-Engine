- id: q-034
  question: What are Kubernetes DaemonSets used for?
  intent: rag
  feature: wild
  sources: [concepts__workloads__controllers__daemonset.html]
  reference: A DaemonSet ensures that all (or some) nodes run a copy of a Pod. As nodes are added, Pods are added to them. It is typically used for node-level agents such as log collectors, monitoring agents or storage daemons.

- id: q-035
  question: How do I expose a Kubernetes Deployment to external traffic?
  intent: rag
  feature: wild
  sources: [tutorials__kubernetes-basics__expose__expose-intro.docx, concepts__services-networking__service.txt]
  reference: Create a Service for it. A NodePort Service exposes it on each node's IP at a static port, and a LoadBalancer Service creates an external load balancer with a fixed external IP (where the cloud supports it).

- id: q-036
  question: Which RBAC permissions can let someone escalate their privileges in a cluster?
  intent: rag
  feature: wild
  sources: [concepts__security__rbac-good-practices.pdf]
  reference: Permissions such as the escalate verb, get on nodes/proxy, and creating PersistentVolumes with access to the host filesystem can let a user or service account escalate privileges. Grant only the least privileges needed.
