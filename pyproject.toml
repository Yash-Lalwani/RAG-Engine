[project]
name = "rag-engine"
version = "0.1.0"
description = "A reusable advanced RAG engine exposed as an MCP server."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "openai>=3.20.0",
    "qdrant-client>=1.19.1",
    "fastembed>=0.8.1",
    "docling>=2.130.0",
    "sentence-transformers>=6.1.0",
    "voyageai>=0.5.0",
    "upstash-redis>=1.8.0",
    "tavily-python>=0.8.4",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "sqlglot>=30.20.0",
    "transformers>=5.17.0",
    "mcp>=2.2",
    "uvicorn>=0.54.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "psycopg-pool>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyyaml>=6.0.3",
    "ruff>=0.7",
]

[build-system]
requires = ["uv_build>=0.11.23,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration and not llm'"
filterwarnings = [
    # The LangSmith OpenAI wrapper serializes structured outputs; Pydantic warns about the
    # `parsed` field. Harmless (see src/rag_engine/tracing.py).
    "ignore:Pydantic serializer warnings:UserWarning",
]
markers = [
    "integration: needs Docker services (docker compose up -d qdrant postgres) or model downloads",
    "llm: calls the OpenAI API (needs OPENAI_API_KEY, costs a little)",
]

# Linux (the Docker image) uses CPU-only torch; the default Linux build pulls in ~19 CUDA packages.
# torchvision must come from the same index, or it does not match the CPU torch build.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
